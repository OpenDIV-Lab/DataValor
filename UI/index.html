<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataValor 工作台</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workflow-editor.css"><link rel="stylesheet" href="layout-v3.css"><link rel="stylesheet" href="workbench-api.css"><link rel="stylesheet" href="workbench-complex.css"><link rel="stylesheet" href="workbench-overlay.css"></head>
<body>
<header><div class="brand"><b>DV</b><strong>DataValor<small>数据产品实验台</small></strong></div><div class="draft"><i></i>工作流草稿 <small id="saved">已自动保存</small></div><div class="actions"><button id="reset">重置布局</button><button id="import">导入配置</button><button class="primary" id="export">导出工作流</button><input id="file" type="file" accept="application/json" hidden></div></header>
<main>
 <aside class="sidebar"><label>WORKSPACE</label><button class="nav" data-page="dashboard">▦　概览</button><button class="nav active" data-page="workflow">⌘　流程设计</button><button class="nav" data-page="products">◇　数据产品</button><button class="nav" data-page="governance">▣　治理与权利</button><button class="nav" data-page="profiling">⌁　画像与漂移</button><button class="nav" data-page="evaluation">✓　质量评估</button><button class="nav" data-page="valuation">¥　估值</button><button class="nav" data-page="market">⇄　定价与市场</button><button class="nav" data-page="query">⌕　受治理查询</button><button class="nav" data-page="analysis">◫　实验与分析</button><button class="nav" data-page="runs">▥　运行记录</button><button class="nav" data-page="artifacts">◎　产物中心</button><button class="nav" data-page="capabilities">⚙　组件目录</button><label>模块筛选</label><div id="filters"></div><div class="grow"></div><label>执行模式</label><p id="apiState">● 正在连接本地 API</p></aside>
 <section class="center"><div class="toolbar"><div><h1 id="pageTitle">数据处理流程</h1><p id="pageSubtitle">模块可重复添加 · Shift+拖动背景框选 · 选中多个模块可整体移动</p></div><div class="tools" id="workflowTools"><button id="zoomOut">−</button><button id="zoomLabel">100%</button><button id="zoomIn">＋</button><button id="fit">适配</button><span class="type-picker"><select id="addType"></select><i id="typeInfo"></i></span><button class="accent" id="addNode">＋ 添加环节</button><span>预设</span><select id="preset"></select><button id="apply">应用</button></div></div><div class="viewport" id="viewport"><div class="canvas" id="canvas"><svg id="edges"></svg><div id="nodes"></div><div id="selectionBox"></div><div class="hint">拖动标题移动 · 按住背景平移 · Shift+拖动框选 · 滚轮缩放</div></div></div><div id="resourceView" class="resource-view" hidden></div><footer><b id="validation">正在检查工作流</b><span>每个启用环节必须具有有效输入；独立处理可使用手动输入</span></footer></section>
 <aside class="inspector"><div class="empty" id="empty"><b>⌁</b><h2>选择一个模块</h2><p>查看内部组分，配置实现、参数、输入与输出。</p></div><div id="detail" hidden></div></aside>
</main><div id="toast"></div><script src="app.js"></script><script src="workbench-api.js"></script><script src="workbench-complex.js"></script></body></html>
