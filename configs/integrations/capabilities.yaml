schema_version: datavalor.capabilities/v1
base_install_requires_external_repos: false
probe_policy:
  import_only_at_execution: true
  no_network_calls: true
  no_silent_fallback: true
capabilities:
  - name: pydvl
    module: pydvl
    distribution: pydvl
    extra: pydvl
  - name: opendataval
    module: opendataval
    distribution: opendataval
    extra: valuation
  - name: cleanlab
    module: cleanlab
    distribution: cleanlab
    extra: quality
  - name: great_expectations
    module: great_expectations
    distribution: great-expectations
    extra: quality
  - name: evidently
    module: evidently
    distribution: evidently
    extra: quality
  - name: fg_data_profiling
    module: ydata_profiling
    distribution: ydata-profiling
    extra: profiling
  - name: torchmetrics
    module: torchmetrics
    distribution: torchmetrics
    extra: torch
  - name: mesa
    module: mesa
    distribution: mesa
    extra: simulation
  - name: wilds
    module: wilds
    distribution: wilds
    extra: benchmark
  - name: datahub
    module: datahub.emitter.rest_emitter
    distribution: acryl-datahub
    extra: governance
  - name: datahub_mce_builder
    module: datahub.emitter.mce_builder
    distribution: acryl-datahub
    extra: governance
  - name: datahub_mcp
    module: datahub.emitter.mcp
    distribution: acryl-datahub
    extra: governance
  - name: openmetadata
    module: metadata.ingestion.ometa.ometa_api
    distribution: openmetadata-ingestion
    extra: governance
  - name: pydeequ
    module: pydeequ
    distribution: pydeequ
    extra: governance
  - name: syft
    module: syft
    distribution: syft
    extra: governance
  - name: ocean_py
    module: ocean_lib
    distribution: ocean-lib
    extra: market
