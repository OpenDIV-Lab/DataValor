schema_version: "1.0"
target:
  venue: KDD 2027
  track: Datasets & Benchmarks
  cycle: 2
  cycle_status: awaiting_official_cfp
  official_cfp: https://kdd2027.kdd.org/datasets-and-benchmarks-track-call-for-papers/
  paper_positioning: benchmark_science

requirements:
  headline_family_count_min: 12
  headline_family_count_max: 18
  reference_grade_per_track_min: 2
  reference_sources_per_track_min: 2
  independent_blocks_per_track_min: 3
  generator_families_per_track_min: 3
  heldout_blocks_per_track_min: 3
  replication_blocks_per_track_min: 2
  real_heldout_scope: real_trained_game
  clean_room_operators_min: 2
  external_validation_records_min: 5
  external_validation_fixtures_min: 3
  external_validation_methods_min: 5
  external_validation_sources_min: 4
  external_validation_repositories_min: 3
  external_validation_tracks_min: 2

flagships:
  valuation:
    setting_id: V-REPLICATION-ROBUSTNESS
    structural_axis: replication_factor
    method_ids:
      - shapley_exact
      - tmc_shapley
      - banzhaf_exact
      - knn_shapley
      - volume_shapley
      - robust_volume_shapley
  procurement:
    setting_id: P-MARKET-CONCENTRATION
    structural_axis: largest_singleton_share
    method_ids:
      - generalized_proportional_share
      - cgl_deterministic
      - cgl_randomized
      - jt_greedy_tm
      - jt_random_eom
      - jt_deterministic_eom
  trading:
    setting_id: T-MARKET-THICKNESS
    structural_axis: efficient_trade_count
    method_ids:
      - mcafee
      - trade_reduction
      - sbba
      - lottery_muda
      - vickrey_muda

# `verified` means the repository contains an explicit paper/official-output
# parity test, not merely a smoke or local-property test.  The conservative
# statuses below are intentional and make the current release fail closed.
parity_evidence:
  shapley_exact: {status: verified, paths: [benchmark/tests/test_valuation_fidelity.py, benchmark/tests/test_external_shapley_crosscheck.py, benchmark/docs/reference_fidelity_exact_shapley.md], note: exact coalition enumeration against hand-derived values plus byte-bound independent implementation agreement on normalized games and a retained nonzero-empty boundary}
  tmc_shapley: {status: verified, paths: [benchmark/tests/test_shapley_method_adapters.py], note: source-algorithm contract and exact-game checks}
  banzhaf_exact: {status: verified, paths: [benchmark/tests/test_valuation_track.py], note: exact Banzhaf definition checks}
  knn_shapley: {status: verified, paths: [benchmark/tests/test_valuation_expansion.py], note: exact KNN-Shapley recursion checks}
  volume_shapley: {status: verified, paths: [benchmark/tests/test_replication_expansion.py, benchmark/docs/reference_fidelity_volume.md], note: Equation 3 exact owner-Shapley core and fixed three-owner coalition-volume vector; preprocessing deviations remain explicit}
  robust_volume_shapley: {status: verified, paths: [benchmark/tests/test_replication_expansion.py, benchmark/docs/reference_fidelity_volume.md], note: official cube means, alpha=1/(10N), density multiplier, characteristic value, and exact Shapley vector; preprocessing deviations remain explicit}
  generalized_proportional_share: {status: verified, paths: [benchmark/tests/test_procurement_fidelity.py, benchmark/docs/reference_fidelity_singer_core.md], note: Singer proportional-share source core with dynamic marginal-density prefix and additive closed-form threshold fixture; complete randomized mechanism remains an explicit deviation}
  cgl_deterministic: {status: verified, paths: [benchmark/tests/test_procurement_fidelity.py, benchmark/docs/reference_fidelity_procurement.md], note: exact Mechanism-SM singleton comparison constant, exact excluded optimum, Greedy-SM branch, and full-rule threshold payments}
  cgl_randomized: {status: verified, paths: [benchmark/tests/test_procurement_fidelity.py, benchmark/docs/reference_fidelity_procurement.md], note: Random-Mechanism-SM 3/5 Greedy-SM(B/2) and 2/5 singleton branches with threshold payments}
  jt_greedy_tm: {status: verified, paths: [benchmark/tests/test_jalaly_tardos_expansion.py, benchmark/docs/reference_fidelity_procurement.md], note: Greedy-TM(0.5) pseudocode, paper tight example, and critical-threshold boundary checks}
  jt_random_eom: {status: verified, paths: [benchmark/tests/test_jalaly_tardos_expansion.py, benchmark/docs/reference_fidelity_procurement.md], note: exact-oracle prefix, 1/2 seeded mixture, and critical-threshold boundary checks}
  jt_deterministic_eom: {status: verified, paths: [benchmark/tests/test_jalaly_tardos_expansion.py, benchmark/docs/reference_fidelity_procurement.md], note: published singleton constant, exact excluded optimum, both branches, and critical-threshold boundary checks}
  mcafee: {status: verified, paths: [benchmark/tests/test_trading_fidelity.py, benchmark/docs/reference_fidelity_trading.md], note: paper candidate-price and trade-reduction golden cases}
  trade_reduction: {status: verified, paths: [benchmark/tests/test_trading_fidelity.py, benchmark/docs/reference_fidelity_trading.md], note: McAfee homogeneous single-unit k-1 rule, marginal b_k/s_k transfers, zero-quantity boundaries, and tied-report behavior}
  sbba: {status: verified, paths: [benchmark/tests/test_trading_fidelity.py, benchmark/docs/reference_fidelity_trading.md], note: Section 3 case split, price setter, marginal buyer exclusion, and uniform seller lottery}
  lottery_muda: {status: verified, paths: [benchmark/tests/test_trading_fidelity.py, benchmark/docs/reference_fidelity_muda.md], note: paper single-unit restriction with independent split, cross-market Walrasian prices, real-trader long-side lottery, strict willingness, and direct balanced transfers}
  vickrey_muda: {status: verified, paths: [benchmark/tests/test_trading_fidelity.py, benchmark/docs/reference_fidelity_muda.md], note: paper single-unit restriction with cross-market prices, displaced long-side threshold transfers, and exact weak-budget-balance surplus fixture}

evidence:
  independent_case_manifests:
    - benchmark/evidence/case_bank_development_v1.json
  heldout_manifests:
    - benchmark/evidence/kdd_heldout_confirmatory_v1.json
    - benchmark/evidence/kdd_heldout_replication_v2.json
  replication_report_manifest: benchmark/outputs/kdd_heldout_replication_v2/replication_manifest.json
  artifact_manifest: benchmark/reproduction/kdd2027_core_manifest.json
  reference_outcome_audit: benchmark/outputs/kdd_heldout_confirmatory/reference_outcome_audit.json
  market_semantic_alignment: benchmark/outputs/kdd_market_semantics/market_semantic_alignment.json
  qualification_analysis: benchmark/outputs/kdd_qualification_analysis/summary.json
  finite_incentive_manifest: benchmark/evidence/kdd_finite_incentive_audit_v1.json
  paper_artifact_manifest: benchmark/outputs/kdd_paper/paper_artifact_manifest.json
  mechanism_risk_manifest: benchmark/outputs/kdd_mechanism_risks/manifest.json
  public_release_record: benchmark/catalog/kdd_public_release.yaml
  # This live evidence file is created only after the immutable source archive
  # is published. It is deliberately absent from and unbound by the core package.
  post_release_evidence_manifest: benchmark/evidence/post_release/kdd_release_evidence.yaml
  clean_room_records: []
  external_validation_records:
    - benchmark/evidence/external_opendataval_knn_shapley_v1.json
    - benchmark/evidence/external_erelsgl_mcafee_v1.json
    - benchmark/evidence/external_erelsgl_trade_reduction_v1.json
    - benchmark/evidence/external_erelsgl_sbba_v1.json
    - benchmark/evidence/external_svarm_exact_shapley_v1.json
