schema_version: "1.0"
study_id: kdd2027-trading-geometry-v1
setting_id: T-MARKET-GEOMETRY
evidence_tier: exploratory_controlled_stress
heldout_evidence: false
question: >-
  With participant count and efficient trade count fixed, how much of each
  mechanism's GFT variation is associated with marginal-surplus geometry,
  buyer/seller support asymmetry, and random partition imbalance?
methods:
  - mcafee
  - trade_reduction
  - sbba
  - random_sampling_double
  - lottery_muda
  - vickrey_muda
design:
  buyer_count: 16
  seller_count: 16
  efficient_trade_count: 8
  minimum_efficient_surplus: [0.02, 0.20, 0.60]
  buyer_margin_share: [0.20, 0.50, 0.80]
randomness:
  seeds:
    start: 0
    stop_exclusive: 128
  semantics: mechanism_randomness_conditional_on_cell
  prohibited_interpretation: independent_market_sample
primary_estimand: expected_gain_from_trade_ratio_over_mechanism_randomness
secondary_estimands:
  - lower_tail_gain_from_trade_ratio
  - capacity_utilization
  - count_matched_frontier_gft_ratio
  - capacity_loss_ratio
  - selection_pricing_loss_ratio
  - zero_trade_probability
  - cross_market_price_availability
  - normalized_cross_market_price_gap
  - efficient_trader_partition_imbalance_sensitivity
claim_boundary:
  - controlled cells are not independent natural markets
  - seed quantiles are not population confidence intervals
  - finite outcomes do not establish or refute DSIC or BIC
  - unit-trader specializations do not establish multi-unit MUDA behavior
  - selection_pricing_loss is a count-matched residual and not a causal decomposition of pricing versus partition effects
primary_sources:
  - reference_key: mcafee1992
    claim_alignment: trade reduction loses at most one efficient trade in the relevant unit setting
  - reference_key: segal_halevi_muda2018
    claim_alignment: random market halving and asymptotic GFT motivate partition and finite-market diagnostics
