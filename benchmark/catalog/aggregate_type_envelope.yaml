schema_version: "1.0"
study_id: cnil-aggregate-type-envelope-v1
setting_id: T-AGGREGATE-TYPE-ENVELOPE
evidence_scope: aggregate_anchor_compatible_model_stress

source:
  institution: Commission Nationale de l'Informatique et des Libertés (CNIL)
  title: "Monetisation of personal data: how much is our data worth?"
  url: https://www.cnil.fr/en/monetisation-personal-data-how-much-our-data-worth
  publication_date: "2025-11-18"
  survey_dates: "2024-12-18/2024-12-23"
  sample_size: 2082
  population: French residents aged 15 and older
  observable: stated monthly compensation for granting personal-data use rights
  source_terms: CC-BY-ND-4.0-FR
  reported_never_sell_share: 0.35

# All registered market-wide double-auction comparators that expose allocation
# and payment outcomes on this single-unit homogeneous domain. The comparison
# group prevents canonical guardrails and diagnostic baselines from being
# reported as if they had the same source-fidelity status as headline papers.
evaluation_methods:
  - method_id: mcafee
    comparison_group: headline_reference
    provenance_kind: paper_exact
    reference_keys: [mcafee_double_auction]
  - method_id: trade_reduction
    comparison_group: headline_reference
    provenance_kind: paper_exact
    reference_keys: [mcafee_double_auction]
  - method_id: sbba
    comparison_group: headline_reference
    provenance_kind: paper_exact
    reference_keys: [sbba]
  - method_id: lottery_muda
    comparison_group: headline_reference
    provenance_kind: paper_variant
    reference_keys: [muda]
  - method_id: vickrey_muda
    comparison_group: headline_reference
    provenance_kind: paper_variant
    reference_keys: [muda]
  - method_id: vcg_double_auction
    comparison_group: canonical_guardrail
    provenance_kind: allocation_oracle
    reference_keys: [vickrey_auction, sbba]
  - method_id: pay_as_bid_double
    comparison_group: pricing_baseline
    provenance_kind: common_baseline
    reference_keys: [pay_as_bid_electricity, pay_as_bid_comparison]
  - method_id: seller_price_double
    comparison_group: pricing_baseline
    provenance_kind: paper_variant
    reference_keys: [chatterjee_samuelson]
  - method_id: midpoint_double
    comparison_group: pricing_baseline
    provenance_kind: paper_variant
    reference_keys: [chatterjee_samuelson]
  - method_id: buyer_price_double
    comparison_group: pricing_baseline
    provenance_kind: paper_variant
    reference_keys: [chatterjee_samuelson]
  - method_id: random_sampling_double
    comparison_group: diagnostic_reference
    provenance_kind: diagnostic_reference
    reference_keys: [sbba]

# Nested decision views expose how winner sets and welfare change as observable
# constraints and source fidelity are required.  These are not a composite
# score and the empirical constraint checks do not prove strategic properties.
selection_views:
  - view_id: unrestricted_all
    label: All registered comparators by raw expected GFT
    comparison_groups: [headline_reference, canonical_guardrail, pricing_baseline, diagnostic_reference]
    provenance_kinds: [paper_exact, paper_variant, allocation_oracle, common_baseline, diagnostic_reference]
    required_empirical_constraints: []
  - view_id: observed_ir_wbb
    label: All comparators satisfying observed IR and WBB on the profile
    comparison_groups: [headline_reference, canonical_guardrail, pricing_baseline, diagnostic_reference]
    provenance_kinds: [paper_exact, paper_variant, allocation_oracle, common_baseline, diagnostic_reference]
    required_empirical_constraints: [individual_rationality, weak_budget_balance]
  - view_id: headline_ir_wbb
    label: Headline references satisfying observed IR and WBB
    comparison_groups: [headline_reference]
    provenance_kinds: [paper_exact, paper_variant]
    required_empirical_constraints: [individual_rationality, weak_budget_balance]
  - view_id: paper_exact_ir_wbb
    label: Paper-exact headline references satisfying observed IR and WBB
    comparison_groups: [headline_reference]
    provenance_kinds: [paper_exact]
    required_empirical_constraints: [individual_rationality, weak_budget_balance]
  - view_id: paper_exact_ir_wbb_sbb
    label: Paper-exact headline references satisfying observed IR, WBB, and SBB
    comparison_groups: [headline_reference]
    provenance_kinds: [paper_exact]
    required_empirical_constraints: [individual_rationality, weak_budget_balance, strong_budget_balance]

# These points are the numeric facts exposed in the accessible alt text of the
# official CNIL supply/demand figure. They are aggregate anchors, not rows.
seller_acceptance_curve:
  - {price_eur_month: 1.00, share_accepting: 0.04}
  - {price_eur_month: 4.30, share_accepting: 0.20}
  - {price_eur_month: 10.75, share_accepting: 0.38}
  - {price_eur_month: 37.84, share_accepting: 0.51}
  - {price_eur_month: 73.10, share_accepting: 0.64}
  - {price_eur_month: 148.78, share_accepting: 0.69}

buyer_acceptance_curve:
  - {price_eur_month: 1.00, share_accepting: 0.99}
  - {price_eur_month: 4.30, share_accepting: 0.90}
  - {price_eur_month: 10.75, share_accepting: 0.75}
  - {price_eur_month: 37.84, share_accepting: 0.50}
  - {price_eur_month: 73.10, share_accepting: 0.25}
  - {price_eur_month: 148.78, share_accepting: 0.10}

construction:
  quantile_units: 100
  within_interval_positions: [lower, midpoint, upper]
  within_interval_rule: evenly_spaced_in_lower_half_full_interval_or_upper_half
  open_interval_epsilon: 0.000001
  right_censored_buyer_policy: lower_bound_only
  unresolved_seller_policy: excluded_from_active_market

claim_boundaries:
  - The profiles are model-generated interval placements, not respondent microdata.
  - Seller responses are stated rather than incentive-compatible reservation costs.
  - Buyer anchors are aggregate advertiser-side values reproduced by CNIL, not bids from a common auction.
  - The nine profiles are a declared sensitivity grid and not sharp partial-identification bounds.
  - Results support robustness diagnostics only and cannot identify population welfare or a universal winner.
