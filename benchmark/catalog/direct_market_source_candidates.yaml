schema_version: "1.0"
audit_date: "2026-10-04"

# Admission is conjunctive: a candidate can inform limitations or future work,
# but it cannot generate a benchmark cohort unless every criterion is met.
eligibility_criteria:
  - institution_semantics
  - roles_and_rights
  - price_semantics
  - reproducible_access
  - reuse_rights
  - privacy_safe
  - independent_units
  - transformation_audit

candidates:
  - candidate_id: ai-training-data-deals
    name: AI Training Data Deals CC BY 4.0 snapshot
    source_url: https://huggingface.co/datasets/midah/ai-data-deals/tree/f8ce413790627e25138104d5f23d169430bb8aa6
    source_kind: public_ai_data_licensing_deal_registry
    observable: deal-level pricing mechanism, reported financial terms, buyer, seller, use case, modality, and provenance
    proposed_use: deal-level disclosure and reported-payment support evidence only
    proposed_inference_unit: buyer or seller counterparty block, never an unclustered deal row
    declared_status: eligible
    admission_scope:
      evidence_unit: public corporate data-licensing deal
      allowed_uses:
        - deal-level pricing-mechanism landscape
        - deal-level payment-disclosure audit
        - reported-payment support envelope
      prohibited_uses:
        - seller reservation-cost calibration
        - buyer-value calibration
        - mechanism outcome benchmarking
        - row-iid population inference
    criteria:
      institution_semantics: {status: met, evidence: "The registry records publicly reported bilateral AI training/RAG data-licensing deals and their stated pricing mechanisms.", limitation: "The deals are heterogeneous bilateral contracts, not outcomes from one standardized marketplace or auction."}
      roles_and_rights: {status: met, evidence: "Rows distinguish buyer, seller/content provider, use case, exclusivity, modality, and deal provenance with explicit missingness.", limitation: "Contract rights are incompletely disclosed and cannot be inferred when exclusivity or use fields are unknown."}
      price_semantics: {status: met, evidence: "Financial terms preserve the source wording, confidence, price basis, estimates, revenue shares, and undisclosed states; a frozen audit admits only seven rows as reported deal amounts.", limitation: "Contract payment is not seller reservation cost, buyer value, per-record value, or a comparable equilibrium price."}
      reproducible_access: {status: met, evidence: "The 78-row Parquet source is pinned at commit f8ce413790627e25138104d5f23d169430bb8aa6 with SHA-256 4a5f21b2fe0d5afa1916899a5f19ed21fdb710841d0a5c649093cdcdff0abef7; the minimized normalized snapshot is release-bound.", limitation: "Rebuilding from upstream requires a Parquet reader, while the released audit consumes the normalized JSON using the Python standard library."}
      reuse_rights: {status: met, evidence: "The pinned Hugging Face dataset card declares CC BY 4.0; the derivative records dataset identity, author handle, revision, source URL, and licence.", limitation: "Underlying press passages retain their own rights, so the derivative omits long source quotations and keeps URLs plus row hashes."}
      privacy_safe: {status: met, evidence: "The source describes public organization-level deals and the derivative contains no participant, wallet, contact, or natural-person identifiers.", limitation: "Public corporate counterparties remain named because counterparty concentration is part of the admitted deal-level evidence."}
      independent_units: {status: met, evidence: "The audit reports 18 buyer and 56 seller clusters and exposes the 22-row top-buyer concentration instead of treating 78 rows as independent markets.", limitation: "Repeated buyers and sellers prohibit row-iid inference and the source is a convenience registry rather than a probability sample."}
      transformation_audit: {status: met, evidence: "Every minimized row carries a canonical hash and a frozen evidence class; duplicate or unclassified rows fail closed and deterministic reports expose the complete disclosure funnel.", limitation: "Evidence-class decisions are conservative semantic annotations and do not normalize heterogeneous contract values into a common price."}

