      privacy_safe: {status: unknown, evidence: "The prospective extract can omit raw addresses from public benchmark rows.", limitation: "Public wallet addresses remain linkable and require a documented minimization decision."}
      independent_units: {status: met, evidence: "The joined set covers 56 assets and can use asset or exchange rather than transaction as the unit.", limitation: "Two assets account for 142 of 198 events, so transaction rows cannot be treated as independent."}
      transformation_audit: {status: met, evidence: "The existing audit records buy direction, exchange join, matching order emitter, fee treatment, and concentration.", limitation: "Token decimals and fiat normalization remain release-time transformation choices."}

