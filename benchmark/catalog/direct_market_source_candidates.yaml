    source_kind: incentive_compatible_reservation_price_experiment
    observable: minimum willingness to accept for sharing identifiable psychometric data
    proposed_use: seller reservation-type calibration under secondary-monetization salience
    proposed_inference_unit: participant
    declared_status: ineligible
    criteria:
      institution_semantics: {status: met, evidence: "The experiment makes one randomly selected data-sharing decision consequential and pays participants accordingly.", limitation: "This is a controlled laboratory market, not a deployed commercial marketplace."}
      roles_and_rights: {status: met, evidence: "The paper documents data subjects, anonymous recipients, a third party, released psychometric data, and monetary benefits.", limitation: "Experimental recipients do not self-select and cannot conduct unsanctioned trades."}
      price_semantics: {status: met, evidence: "The multiple price list elicits minimum willingness to accept at $0.01, $0.49, $0.99, $1.99, and $2.99 plus nonparticipation.", limitation: "The bounded elicitation grid should not be generalized to commercial market prices."}
      reproducible_access: {status: met, evidence: "The version-of-record page exposes official online appendix and data files under the article DOI.", limitation: "Access certification is designed for verification of the source paper, not unrestricted benchmark reuse."}
      reuse_rights: {status: not_met, evidence: "Management Science policy limits downloaded replication files to verifying the paper and requires author permission for other research use.", limitation: "A benchmark cohort requires written author permission or a separately licensed deposit."}
      privacy_safe: {status: unknown, evidence: "The study involves personally identifiable psychometric data and participant-level choices.", limitation: "The package must be inspected for de-identification and consent scope before any reuse."}
      independent_units: {status: met, evidence: "The published common-condition analysis reports 1,188 participant clusters.", limitation: "Repeated conditions within a participant cannot be treated as independent units."}
      transformation_audit: {status: unknown, evidence: "Published materials describe conditions, price grid, participation, and clustered analysis.", limitation: "A reusable variable-level codebook and benchmark transformation cannot be audited without permitted package access."}

