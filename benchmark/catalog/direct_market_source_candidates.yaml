      roles_and_rights: {status: met, evidence: "Contract events identify exchange, data token, base token, market fee collectors, and order emitter roles.", limitation: "Wallet identities do not identify economic organizations or beneficial owners."}
      price_semantics: {status: met, evidence: "baseTokenSwappedAmount is a gross buyer pull that already includes the emitted swap fees.", limitation: "The amount is neither seller reservation cost nor buyer value."}
      reproducible_access: {status: unknown, evidence: "Partitioned Blockscout scans reproduced 316 swap events and 198 joined settlements in the audit snapshot.", limitation: "No immutable, licensed event-set deposit currently pins the indexed output."}
