  - candidate_id: alizadeh-gilardi-x-marketplace
    name: Alizadeh and Gilardi X-data marketplace experiments
    source_url: https://osf.io/c6uj8/
    source_kind: preregistered_survey_experiment
    observable: BDM-framed but ultimately non-consequential stated minimum price and willingness to sell an X data package
    proposed_use: stated seller-type support and participation calibration
    proposed_inference_unit: participant
    declared_status: ineligible
    criteria:
      institution_semantics: {status: met, evidence: "The experiments compare marketplace, donation, and one-time-purchase descriptions for selling a complete X data package and elicit a minimum acceptable amount.", limitation: "The debrief states that no marketplace existed, no X archive was requested, and no price-contingent payment or transfer was executed; this is a stated-preference institution, not consequential BDM or a deployed market."}
      roles_and_rights: {status: met, evidence: "The instrument distinguishes the data subject, university or company buyer, described marketplace, complete X archive, privacy safeguard, and hypothetical compensation.", limitation: "The described buyers and marketplace were experimental prompts; no access right or secondary use was actually transferred."}
      price_semantics: {status: met, evidence: "The files distinguish SELL participation, MINPRICE, donation, treatment group, and the offered ranges, while the paper and debrief identify the minimum amount as a stated response.", limitation: "BDM-framed instructions without an implemented price draw, incremental payment, or data transfer do not identify an incentive-compatible reservation price."}
      reproducible_access: {status: met, evidence: "The public OSF project c6uj8 exposes Study1_WTS_Expanded.csv (240293 bytes, SHA-256 6e6c69376701ede17c45598f6677e4e3a7843febc054b3b39f111762c51b4645) and Study2_WTS_Expanded.csv (238590 bytes, SHA-256 5a3c7d74741cdfea63337dc642d8d396ab766e01a3edcc1bbce7e0f2ffcd1597); the arXiv source links the same project.", limitation: "The OSF project is mutable rather than a registered immutable version, so the exact file hashes—not the project URL alone—are required for any future audit."}
      reuse_rights: {status: not_met, evidence: "The OSF node metadata contains no project licence and no file-specific reuse grant; public download access is not a redistribution or derivative-analysis licence.", limitation: "Written author permission or a separately versioned deposit with an explicit open-data licence is required before any row or derived type profile enters the release."}
      privacy_safe: {status: not_met, evidence: "Both 43-column CSVs expose Prolific ID, ResponseId, RecordedDate, demographics, privacy-history responses, and three free-text fields (NOTWILLING, WILLING, OTHER).", limitation: "Do not copy the CSVs into DataMechBench; a licensed, author-produced minimized extract plus documented consent scope is required, and locally deleting columns cannot cure absent reuse permission."}
      independent_units: {status: met, evidence: "The files retain participant identifiers that could define participant clusters and keep the two experiments separate.", limitation: "The observed files contain 1280 and 1239 rows versus the paper's stated N=1250 per study, and Study 1 contains repeated Prolific IDs; exclusions, duplicates, and analysis populations require an author codebook before inference."}
      transformation_audit: {status: not_met, evidence: "The OSF root contains Data and PreRegistration folders but no analysis code or variable-level codebook; the CSV row counts do not directly reproduce the two stated analysis Ns.", limitation: "A future transform must pin an author-supplied codebook and exclusion/deduplication rules, preserve non-sale separately from MINPRICE, and label the values as non-consequential stated prices."}

