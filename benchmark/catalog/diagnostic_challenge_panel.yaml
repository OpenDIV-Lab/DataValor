schema_version: "1.0"
study_id: kdd-diagnostic-challenge-v1
cohort: diagnostic_challenge
selection_rule: theory_boundary_conditions_fixed_before_mechanism_execution
random_seeds: [1701, 2903, 4703]
practical_tolerance: 0.01
claim_boundary: Diagnostic counterexample and resolution search only; not held-out population or source-transfer evidence.
headline_methods:
  procurement: [generalized_proportional_share, cgl_deterministic, cgl_randomized, jt_greedy_tm, jt_random_eom, jt_deterministic_eom]
  trading: [mcafee, trade_reduction, sbba, lottery_muda, vickrey_muda]
cases:
  procurement:
    - case_id: PCH-diffuse
      theory_clause: multi_item_selection_under_diffuse_value
      values: [1, 1, 1, 1]
      costs: [1, 1, 1, 1]
      budget: 3
      paper_claim_expectation: Budget-feasible rules may select several sellers; no singleton should dominate the efficient value.
    - case_id: PCH-singleton-boundary
      theory_clause: largest_singleton_branch_boundary
      values: [6, 2, 2, 2]
      costs: [2, 1, 1, 1]
      budget: 3
      paper_claim_expectation: Singleton-comparison mechanisms may change branch relative to the diffuse cell.
    - case_id: PCH-threshold-boundary
      theory_clause: near_budget_critical_payment_boundary
      values: [5, 4, 3, 2]
      costs: [2.9, 1.1, 1.0, 0.9]
      budget: 3
      paper_claim_expectation: Allocation and critical-payment computation are tested near the hard budget.
    - case_id: PCH-density-tie
      theory_clause: equal_value_cost_density_tie
      values: [8, 6, 4, 2]
      costs: [4, 3, 2, 1]
      budget: 6
      paper_claim_expectation: Deterministic seller-ID tie breaking should make equal-density outcomes reproducible.
  trading:
    - case_id: TCH-one-efficient-trade
      theory_clause: single_efficient_trade_reduction_boundary
      buyer_values: [1, 0.4]
      seller_costs: [0.2, 0.8]
      paper_claim_expectation: The k-minus-one trade-reduction rule makes zero trades when efficient k equals one.
    - case_id: TCH-candidate-feasible
      theory_clause: mcafee_candidate_price_feasible
      buyer_values: [1, 0.9, 0.4]
      seller_costs: [0.1, 0.2, 0.8]
      paper_claim_expectation: The McAfee candidate price lies inside the marginal trading interval.
    - case_id: TCH-candidate-infeasible
      theory_clause: mcafee_candidate_price_infeasible
      buyer_values: [1, 0.7, 0.69]
      seller_costs: [0.1, 0.6, 0.95]
      paper_claim_expectation: The McAfee candidate price is outside the marginal trading interval and forces trade reduction.
    - case_id: TCH-marginal-tie
      theory_clause: weak_crossing_with_tied_reports
      buyer_values: [1, 0.8, 0.8, 0.2]
      seller_costs: [0.2, 0.4, 0.8, 0.9]
      paper_claim_expectation: Weak efficient crossing and strict MUDA willingness remain visibly distinct.
    - case_id: TCH-side-asymmetry
      theory_clause: unequal_buyer_seller_populations
      buyer_values: [1, 0.9, 0.8, 0.3, 0.2]
      seller_costs: [0.1, 0.4, 0.85]
      paper_claim_expectation: Mechanisms must handle unequal report counts without padding synthetic agents.
