schema_version: "1.0"
transfers:
  - transfer_id: procurement_submodular_to_measured_ml
    track: procurement
    source_setting: P-SUBMODULAR
    target_setting: P-ML-ACQUISITION
    rationale: Tests whether performance under theorem-friendly monotone submodular utility transfers to utility measured by an ML acquisition task.
    mechanism_scope: [jt_greedy_tm, jt_random_tm, jt_random_eom, jt_deterministic_eom]
    preserved: [published allocation rule, published mixture probability, threshold-payment construction, exact optimum oracle where required]
    not_preserved: [monotone_submodular_utility guarantee]
    interpretation: Empirical transfer stress test only; theorem guarantees are not claimed for measured ML utility.
  - transfer_id: triple_eagle_submodular_to_measured_ml
    track: procurement
    source_setting: P-SUBMODULAR
    target_setting: P-ML-ACQUISITION
    rationale: Tests whether the two fast Triple Eagle mechanisms retain useful welfare and payment behavior when the set function is measured by an ML acquisition task.
    mechanism_scope: [triple_eagle_randomized, triple_eagle_deterministic]
    preserved: [published Algorithms 1-3, published alpha constants and branch probabilities, fixed arbitrary seller order, offered-price payments]
    not_preserved: [monotone_submodular_utility guarantee]
    interpretation: Empirical transfer stress test only; the NeurIPS 2023 approximation guarantees are not claimed for measured ML utility.
  - transfer_id: double_auction_to_correlated_values
    track: trading
    source_setting: T-DOUBLE
    target_setting: T-CORRELATED
    rationale: Tests whether double-auction performance under independent private values transfers when values share a correlated common component.
