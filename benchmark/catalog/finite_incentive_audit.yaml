schema_version: "1.0"
claim_strength: empirical_finite_domain_audit
true_types: [1, 2, 3, 4]
reports: [0, 1, 2, 3, 4, 5]
tolerance: "1e-9"

procurement:
  seller_ids: [s0, s1, s2]
  public_values: {s0: 4, s1: 3, s2: 2}
  budget: 4
  methods:
    - {method_id: generalized_proportional_share, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "Singer proportional-share source core is monotone with critical payments on monotone submodular single-parameter instances"}
    - {method_id: cgl_deterministic, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "CGL Mechanism-SM is claimed universally truthful in its source theorem domain"}
    - {method_id: cgl_randomized, seeds: [0, 1, 2, 3], stochastic: true, expected_max_gain: 0, expectation: "CGL Random-Mechanism-SM is claimed universally truthful in its source theorem domain"}
    - {method_id: jt_greedy_tm, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "Greedy-TM with threshold payments is claimed truthful in its source theorem domain"}
    - {method_id: jt_random_eom, seeds: [0, 1, 2, 3], stochastic: true, expected_max_gain: 0, expectation: "Random-EOM is claimed universally truthful in its source theorem domain"}
    - {method_id: jt_deterministic_eom, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "Deterministic-EOM is claimed truthful in its source theorem domain"}

trading:
  buyer_ids: [b0, b1]
  seller_ids: [s0, s1]
  methods:
    - {method_id: mcafee, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "McAfee's mechanism is claimed dominant-strategy incentive compatible on the homogeneous single-unit domain"}
    - {method_id: trade_reduction, seeds: [0], stochastic: false, expected_max_gain: 0, expectation: "The McAfee trade-reduction branch is claimed dominant-strategy incentive compatible"}
    - {method_id: sbba, seeds: [0, 1, 2, 3], stochastic: true, expected_max_gain: 0, expectation: "SBBA is claimed truthful for every realized random exclusion in its source setting"}
    - {method_id: lottery_muda, seeds: [0, 1, 2, 3], stochastic: true, expected_max_gain: 0, expectation: "Lottery-MUDA is claimed universally truthful under its independent random partition and lottery"}
    - {method_id: vickrey_muda, seeds: [0, 1, 2, 3], stochastic: true, expected_max_gain: 0, expectation: "Vickrey-MUDA is claimed universally truthful under its independent random partition"}
