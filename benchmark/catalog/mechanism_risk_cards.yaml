schema_version: "1.0"

# This catalog is an evidence-scope contract, not a mechanism risk rating.
# The validator rejects score/rank/winner fields and requires every headline
# card to expose at least one dimension that the released benchmark cannot audit.
no_cross_method_composite: true

dimension_templates:
  valuation: &valuation_dimensions
    score_or_allocation_incidence:
      status: audited_scope
      scope: Owner-level score/rank/reward-share responses and top-k downstream utility on the frozen replication cases.
      evidence_metric_ids: [replication_owner_rank_change, replication_reward_share_gain, topk_test_utility]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/confirmatory_contrasts.csv
    payment_incidence:
      status: not_auditable
      reason: The headline valuation protocol emits scores but does not define or observe a real transfer rule.
    individual_rationality:
      status: not_auditable
      reason: Owner participation utilities and outside options are absent, so score outputs cannot establish owner IR.
    budget_feasibility:
      status: not_auditable
      reason: No deployer budget or score-to-payment map is part of the frozen valuation contract.
    manipulation_evidence:
      status: audited_scope
      scope: Exact-copy replication responses only; this is not a general strategic-report or false-name audit.
      evidence_metric_ids: [replication_owner_rank_change, replication_reward_share_gain, replication_score_inflation_ratio]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/confirmatory_contrasts.csv
    subgroup_fairness:
      status: not_auditable
      reason: The released cases do not provide lawful, meaningful protected-group labels or a registered fairness estimand.
    privacy_externality:
      status: not_auditable
      reason: Training-data disclosure and re-identification consequences are outside the benchmark result schema.

  procurement: &procurement_dimensions
    score_or_allocation_incidence:
      status: audited_scope
      scope: Winner selection, buyer value, seller surplus, and oracle-relative utility under the frozen budgeted procurement cases.
      evidence_metric_ids: [oracle_ratio, buyer_utility, seller_surplus]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    payment_incidence:
      status: audited_scope
      scope: Mechanism-emitted seller transfers and their aggregate budget use; it does not observe real seller welfare.
      evidence_metric_ids: [total_payment, budget_used_ratio, seller_surplus]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    individual_rationality:
      status: audited_scope
      scope: Ex-post selected-seller payments relative to evaluator-held proxy true costs.
      evidence_metric_ids: [seller_ir_violation_count]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    budget_feasibility:
      status: audited_scope
      scope: Total mechanism payments relative to the declared hard buyer budget.
      evidence_metric_ids: [budget_violation, budget_used_ratio]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    manipulation_evidence:
      status: audited_scope
      scope: Finite unilateral cost-report deviations over the declared type/report grids and mechanism random-seed panels.
      evidence_metric_ids: [max_deviation_gain, profitable_deviation_count, allocation_monotonicity_violation]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/finite_incentives.csv
        - benchmark/evidence/kdd_finite_incentive_audit_v1.json
    subgroup_fairness:
      status: not_auditable
      reason: Seller demographic or organizational group membership is not collected and no group-fair procurement objective is registered.
    privacy_externality:
      status: not_auditable
      reason: The mechanism audit does not quantify privacy loss from revealing bids, costs, selection, or downstream data use.

  trading: &trading_dimensions
    score_or_allocation_incidence:
      status: audited_scope
      scope: Matched trades and buyer/seller/platform surplus under evaluator-held value and cost proxies.
      evidence_metric_ids: [gain_from_trade_ratio, buyer_surplus, seller_surplus_trading, auctioneer_surplus]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    payment_incidence:
      status: audited_scope
      scope: Per-side transfers, participant surplus, and platform surplus produced by the released mechanism implementation.
      evidence_metric_ids: [buyer_surplus, seller_surplus_trading, auctioneer_surplus, strong_budget_balance]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    individual_rationality:
      status: audited_scope
      scope: Ex-post utility of matched buyers and sellers against evaluator-held proxy types.
      evidence_metric_ids: [individual_rationality, false_trade_count]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    budget_feasibility:
      status: audited_scope
      scope: Weak and strong budget balance plus observed auctioneer surplus for the released clearing outcome.
      evidence_metric_ids: [weak_budget_balance, strong_budget_balance, auctioneer_surplus]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
    manipulation_evidence:
      status: audited_scope
      scope: Finite unilateral value/cost report deviations on the declared profiles; randomized rules use fixed seed panels, not exhaustive random support.
      evidence_metric_ids: [trading_max_deviation_gain]
      evidence_paths:
        - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
        - benchmark/outputs/kdd_decision_impact/inputs/finite_incentives.csv
        - benchmark/evidence/kdd_finite_incentive_audit_v1.json
    subgroup_fairness:
      status: not_auditable
      reason: No protected-group labels or registered group-conditional allocation/payment estimand is present.
    privacy_externality:
      status: not_auditable
      reason: Bid disclosure, transaction-linkage, and downstream data privacy harms are outside the released outcome schema.

cards:
  - method_id: shapley_exact
    track: valuation
    affected_roles: [data owners, model buyer or benchmark evaluator]
    potential_beneficiaries: [owners with consistently positive marginal utility across coalition orders]
    potentially_burdened_roles: [redundant or substitutable owners receiving small scores, owners whose score is later treated as a payment entitlement]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: Exact Data Shapley scores describe the frozen utility game; a separate transfer, participation, privacy, and appeal policy is required before use with people or organizations.
    limitations: [Coalition utility depends on model and task choice, Exact computation does not remove construct or distributional bias]
    dimensions: *valuation_dimensions

  - method_id: tmc_shapley
    track: valuation
    affected_roles: [data owners, model buyer or benchmark evaluator]
    potential_beneficiaries: [owners whose marginal utility is captured before truncation, deployers needing lower-cost Shapley approximation]
    potentially_burdened_roles: [owners whose late-coalition contributions are truncated, owners affected by Monte Carlo variance]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: TMC estimates are approximation evidence under frozen stopping and seed rules, not stable individual compensation amounts.
    limitations: [Truncation can change small contributions, Finite permutation budgets leave estimator uncertainty]
    dimensions: *valuation_dimensions

  - method_id: banzhaf_exact
    track: valuation
    affected_roles: [data owners, model buyer or benchmark evaluator]
    potential_beneficiaries: [owners useful across uniformly weighted coalitions]
    potentially_burdened_roles: [owners favored by permutation-weighted rather than uniform-coalition semantics, redundant owners]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: Exact Banzhaf values answer a different coalition-weighting question from Shapley and must not be substituted as a neutral compensation rule.
    limitations: [Coalition weighting is a normative choice, Exactness is limited to the declared characteristic function]
    dimensions: *valuation_dimensions

  - method_id: knn_shapley
    track: valuation
    affected_roles: [training-data owners, query or test subjects, model buyer]
    potential_beneficiaries: [owners whose examples are locally useful to test queries, deployers using the declared KNN utility]
    potentially_burdened_roles: [owners poorly represented by the test distribution, owners evaluated under an unsuitable neighborhood metric]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: KNN-Shapley is tied to the frozen KNN utility and test sample; it does not authorize pricing data under another model, population, or legal basis.
    limitations: [Distance and test-distribution choices determine incidence, Point-to-owner aggregation can hide within-owner variation]
    dimensions: *valuation_dimensions

  - method_id: volume_shapley
    track: valuation
    affected_roles: [data owners, dataset buyer]
    potential_beneficiaries: [owners adding geometrically distinctive support]
    potentially_burdened_roles: [owners with correlated or low-dimensional records, owners whose predictive usefulness is not captured by volume]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: Volume-based scores measure geometric diversity after declared preprocessing, not realized buyer utility or a fair price.
    limitations: [Preprocessing and scale affect geometric volume, Predictive quality and privacy costs are not represented]
    dimensions: *valuation_dimensions

  - method_id: robust_volume_shapley
    track: valuation
    affected_roles: [data owners, dataset buyer]
    potential_beneficiaries: [owners contributing distinctive support after density reweighting, buyers facing exact-copy duplication]
    potentially_burdened_roles: [owners in dense legitimate subpopulations, owners whose contribution is attenuated by the robustness transform]
    prohibited_uses: [automatic_compensation, automatic_market_access, intrinsic_worth_assessment]
    deployment_boundary: Robust-volume scores are a paper-defined geometric robustness variant; they do not establish group fairness, privacy safety, or welfare-optimal transfers.
    limitations: [Density weighting can penalize valid clusters, Robustness is tested for declared replication patterns only]
    dimensions: *valuation_dimensions

  - method_id: generalized_proportional_share
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [selected sellers paid threshold transfers, buyer receiving budget-feasible utility]
    potentially_burdened_roles: [excluded high-cost or low-marginal-density sellers, sellers near a discontinuous selection threshold]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: Use is limited to controlled procurement analysis with auditable utilities, costs, and appeals; it is not a production award recommendation.
    limitations: [Seller costs are calibrated proxies, Collusion and false-name bidding are not audited]
    dimensions: *procurement_dimensions

  - method_id: cgl_deterministic
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [a high-value singleton or sellers selected by the greedy branch, budget-constrained buyer]
    potentially_burdened_roles: [sellers excluded by the singleton comparison, near-threshold sellers whose outcome changes discretely]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: The deterministic CGL rule is evaluated only under its declared monotone submodular/additive utility interface and proxy costs.
    limitations: [Branch selection concentrates awards in some cases, No collusion or long-run participation model]
    dimensions: *procurement_dimensions

  - method_id: cgl_randomized
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [sellers selected under either randomized branch, buyer benefiting from the approximation mixture]
    potentially_burdened_roles: [eligible sellers losing due to branch randomization, sellers near branch-specific thresholds]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: Randomized branch probabilities and seed-conditioned outcomes must be disclosed; one realization is not an entitlement or fairness decision.
    limitations: [Individual outcomes vary across random branches, Finite seed evidence is not full distributional assurance]
    dimensions: *procurement_dimensions

  - method_id: jt_greedy_tm
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [high marginal-utility-per-cost sellers passing the Greedy-TM condition, buyer retaining budget feasibility]
    potentially_burdened_roles: [higher-cost sellers and sellers arriving just beyond the greedy prefix]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: Greedy-TM comparisons apply to the paper-defined utility and threshold-payment setting, not opaque real procurement without cost and utility review.
    limitations: [Ordering creates threshold discontinuities, Proxy utility may omit seller-side harms]
    dimensions: *procurement_dimensions

  - method_id: jt_random_eom
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [sellers selected by the exact-oracle prefix or singleton mixture, buyer under the declared randomized approximation]
    potentially_burdened_roles: [eligible sellers losing under the sampled branch, sellers excluded by the exact-oracle prefix]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: The randomized EOM result is an expectation-defined mechanism evaluation; fixed-seed outcomes must not be presented as deterministic treatment guarantees.
    limitations: [Branch randomness changes individual incidence, Oracle assumptions may not hold in deployed markets, Payment-derived evidence covers 12 of 18 released runs because one branch omits payment output]
    dimensions:
      <<: *procurement_dimensions
      score_or_allocation_incidence:
        status: audited_scope
        scope: Allocation/oracle ratio covers all 18 released runs; buyer utility and seller surplus cover only the 12 runs with mechanism-emitted payments, while 6 runs are explicitly missing_payments.
        evidence_metric_ids: [oracle_ratio, buyer_utility, seller_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      payment_incidence:
        status: audited_scope
        scope: Seller transfers, budget use, and seller surplus cover 12 of 18 released runs; the other 6 are explicit missing_payments records and are not treated as zero transfers.
        evidence_metric_ids: [total_payment, budget_used_ratio, seller_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      budget_feasibility:
        status: audited_scope
        scope: Payment-based budget feasibility covers 12 of 18 released runs; 6 missing_payments runs remain an explicit evidence gap.
        evidence_metric_ids: [budget_violation, budget_used_ratio]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv

  - method_id: jt_deterministic_eom
    track: procurement
    affected_roles: [data sellers, procuring buyer, excluded sellers]
    potential_beneficiaries: [the chosen singleton or exact-oracle-prefix sellers, buyer receiving the selected branch utility]
    potentially_burdened_roles: [sellers excluded by the deterministic branch comparison, sellers just below critical thresholds]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_real_procurement]
    deployment_boundary: Deterministic EOM evidence assumes the registered oracle and proxy-cost setting and requires human review before any award or exclusion decision.
    limitations: [Deterministic branch choice can concentrate incidence, Utility-oracle errors are not covered by the source guarantee]
    dimensions: *procurement_dimensions

  - method_id: mcafee
    track: trading
    affected_roles: [data buyers, data sellers, market operator, excluded marginal traders]
    potential_beneficiaries: [infra-marginal efficient buyers and sellers, operator when the candidate price clears]
    potentially_burdened_roles: [marginal efficient traders removed in the reduction branch, participants facing platform surplus extraction]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_market_clearing]
    deployment_boundary: McAfee outcomes are evaluated for static homogeneous single-unit reports; dynamic, multi-unit, identity, legal, and privacy controls remain external.
    limitations: [Trade reduction can exclude efficient marginal traders, Collusion and identity splitting are not audited]
    dimensions: *trading_dimensions

  - method_id: trade_reduction
    track: trading
    affected_roles: [data buyers, data sellers, market operator, excluded marginal traders]
    potential_beneficiaries: [infra-marginal traders receiving uniform side prices, operator retaining nonnegative revenue]
    potentially_burdened_roles: [the efficient marginal buyer and seller deliberately excluded, thin-market participants]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_market_clearing]
    deployment_boundary: The k-minus-one rule is a controlled homogeneous-market reference, not a recommendation to exclude marginal real participants.
    limitations: [Capacity loss is severe in thin markets, Multi-unit and dynamic participation are not represented]
    dimensions: *trading_dimensions

  - method_id: sbba
    track: trading
    affected_roles: [data buyers, data sellers, price-setting trader, randomly excluded marginal traders]
    potential_beneficiaries: [traders on the short side and lottery-selected long-side participants]
    potentially_burdened_roles: [the price setter or marginal buyer, long-side traders excluded by the lottery]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_market_clearing]
    deployment_boundary: SBBA random exclusion and price-setting roles must be disclosed; finite counterexamples in the release prevent a blanket strategyproofness claim.
    limitations: [Random selection creates individual incidence variation, Released finite audit contains profitable-deviation witnesses]
    dimensions: *trading_dimensions

  - method_id: lottery_muda
    track: trading
    affected_roles: [data buyers, data sellers, traders assigned across submarkets, lottery-excluded long-side traders]
    potential_beneficiaries: [traders clearing at a cross-market price, participants in sufficiently thick balanced submarkets]
    potentially_burdened_roles: [traders placed in an unfavorable split, long-side traders removed by lottery]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_market_clearing]
    deployment_boundary: Lottery-MUDA evidence covers the registered single-unit independent split and fixed-seed audit, not arbitrary multi-unit or correlated deployment.
    limitations: [Random partition changes individual outcomes, Released tied-profile deviation witnesses limit empirical incentive claims, Payment and surplus evidence covers only 3 of 18 released runs]
    dimensions:
      <<: *trading_dimensions
      score_or_allocation_incidence:
        status: audited_scope
        scope: Gains-from-trade ratio covers all 18 released runs; buyer, seller, and auctioneer surplus cover only 3 runs, with 15 explicit missing_payments records.
        evidence_metric_ids: [gain_from_trade_ratio, buyer_surplus, seller_surplus_trading, auctioneer_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      payment_incidence:
        status: audited_scope
        scope: Transfers and surplus cover only 3 of 18 released runs; 15 missing_payments records are an evidence gap and are not interpreted as zero transfers.
        evidence_metric_ids: [buyer_surplus, seller_surplus_trading, auctioneer_surplus, strong_budget_balance]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      budget_feasibility:
        status: audited_scope
        scope: Weak budget balance is observed in all 18 runs, but strong balance and auctioneer surplus are observed in only 3; 15 runs are explicit missing_payments cases.
        evidence_metric_ids: [weak_budget_balance, strong_budget_balance, auctioneer_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv

  - method_id: vickrey_muda
    track: trading
    affected_roles: [data buyers, data sellers, traders assigned across submarkets, displaced long-side traders]
    potential_beneficiaries: [traders receiving threshold transfers after cross-market pricing, participants in thick submarkets]
    potentially_burdened_roles: [traders displaced on the long side, participants assigned to a weak-price submarket]
    prohibited_uses: [automatic_compensation, automatic_market_access, unreviewed_market_clearing]
    deployment_boundary: Vickrey-MUDA is limited to the registered single-unit specialization; transfer and identity controls need separate deployment review.
    limitations: [Partition geometry affects capacity and payments, Collusion and false-name participation are not audited, Payment and surplus evidence covers only 3 of 18 released runs]
    dimensions:
      <<: *trading_dimensions
      score_or_allocation_incidence:
        status: audited_scope
        scope: Gains-from-trade ratio covers all 18 released runs; buyer, seller, and auctioneer surplus cover only 3 runs, with 15 explicit missing_payments records.
        evidence_metric_ids: [gain_from_trade_ratio, buyer_surplus, seller_surplus_trading, auctioneer_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      payment_incidence:
        status: audited_scope
        scope: Transfers and surplus cover only 3 of 18 released runs; 15 missing_payments records are an evidence gap and are not interpreted as zero transfers.
        evidence_metric_ids: [buyer_surplus, seller_surplus_trading, auctioneer_surplus, strong_budget_balance]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
      budget_feasibility:
        status: audited_scope
        scope: Weak budget balance is observed in all 18 runs, but strong balance and auctioneer surplus are observed in only 3; 15 runs are explicit missing_payments cases.
        evidence_metric_ids: [weak_budget_balance, strong_budget_balance, auctioneer_surplus]
        evidence_paths:
          - benchmark/outputs/kdd_heldout_confirmatory/raw_results.jsonl
          - benchmark/outputs/kdd_decision_impact/inputs/constraint_profiles.csv
