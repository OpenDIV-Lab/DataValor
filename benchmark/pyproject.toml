[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datamechbench"
version = "0.3.0"
description = "Mechanism-first benchmark for data valuation and pricing"
requires-python = ">=3.10"
dependencies = [
  "datavalor>=0.1.0a0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "PyYAML>=6",
]

[project.optional-dependencies]
valuation = ["pyDVL==0.10.0"]
sota = ["shapiq==1.7.0"]
dev = ["pytest>=7", "ruff>=0.4", "tomli>=2; python_version < '3.11'"]

[project.scripts]
datamechbench = "datamechbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/datamechbench/catalog" = ["catalog/*.yaml"]
"share/datamechbench/submission_template" = [
  "submission_template/results.jsonl",
  "submission_template/submission.yaml",
]
"share/datamechbench/case_submission_template" = [
  "case_submission_template/case_submission.yaml",
  "case_submission_template/source_snapshot.json",
  "case_submission_template/transform_case.py",
]
