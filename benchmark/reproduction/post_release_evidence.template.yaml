# Copy this file only after the immutable native-Python archive has been
# published. The live file belongs at:
# benchmark/evidence/post_release/kdd_release_evidence.yaml
#
# Replace every angle-bracket value with a measured value. The readiness
# auditor rejects placeholders, missing files, path escapes, symlinks, duplicate
# paths, and SHA-256 mismatches.
schema_version: "1.0"
manifest_kind: kdd_post_release_evidence
release_id: datamechbench-reference-v0.3-code

core_manifest:
  path: benchmark/reproduction/kdd2027_core_manifest.json
  sha256: <sha256-of-the-published-core-manifest>

# Start from benchmark/catalog/kdd_public_release.yaml, insert only real public
# repository/archive/DOI identifiers plus the actual archive creators and ISO
# publication date, and save the final record at this path. Keep its citation
# version, license, title, resource type, and keywords aligned with the deposit.
public_release_record:
  path: benchmark/evidence/post_release/kdd_public_release.final.yaml
  sha256: <sha256-of-the-final-public-release-record>

# Add records only after genuine non-implementers finish the full native-Python
# reproduction. Two distinct passing operators are required by the KDD target.
clean_room_records:
  - path: benchmark/evidence/post_release/operator-a.json
    sha256: <sha256-of-operator-a-record>
  - path: benchmark/evidence/post_release/operator-b.json
    sha256: <sha256-of-operator-b-record>
