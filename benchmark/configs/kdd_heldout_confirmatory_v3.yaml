transformations:
  common:
    missing_policy: reject_nonfinite
    winsor_quantiles: [0.025, 0.975]
    identity_policy: discard_before_processed_artifact
  valuation:
    maximum_rows: 6000
    split_seed: 1701
    split: {train: 0.60, validation: 0.20, test: 0.20}
    owner_count: 8
    categorical_encoding: training_only_sorted_ordinal_unknown_minus_one
    utility_model: standardized_logistic_regression
    replication_factors: [1, 2, 4]
  procurement:
    cohort_filter: tender_start_date_equals_prespecified_date
    amount_field: all_positive_CLP_bid_value_amounts
    cost_transform: winsorize_then_log1p_then_divide_by_median
    owner_cost_assignment: ascending_rank_to_owner_id
    budget_ratios: [0.30, 0.50]
    utility_source: matched_openml_owner_game
  trading:
    price_transform: winsorize_then_affine_unit_interval
    bid_value: positive_bid_magnitude
    seller_cost: positive_offer
    duplicate_policy: collapse_bmu_pair_by_median
    balanced_market_sizes: [8, 16]

headline_methods:
  valuation: [shapley_exact, tmc_shapley, banzhaf_exact, knn_shapley, volume_shapley, robust_volume_shapley]
  procurement: [generalized_proportional_share, cgl_deterministic, cgl_randomized, jt_greedy_tm, jt_random_eom, jt_deterministic_eom]
  trading: [mcafee, trade_reduction, sbba, lottery_muda, vickrey_muda]

contrasts:
  - {contrast_id: V-BANZHAF-vs-SHAPLEY, track: valuation, method_a: banzhaf_exact, method_b: shapley_exact, metric: replication_rank_gain, direction: lower, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: valuation_replication}
  - {contrast_id: V-RVSV-vs-VSV, track: valuation, method_a: robust_volume_shapley, method_b: volume_shapley, metric: replication_rank_gain, direction: lower, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: valuation_replication}
  - {contrast_id: P-CGLR-vs-GPS, track: procurement, method_a: cgl_randomized, method_b: generalized_proportional_share, metric: oracle_utility_ratio, direction: higher, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: procurement_efficiency}
  - {contrast_id: P-JTDEOM-vs-GPS, track: procurement, method_a: jt_deterministic_eom, method_b: generalized_proportional_share, metric: oracle_utility_ratio, direction: higher, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: procurement_efficiency}
  - {contrast_id: T-MCAFEE-vs-TR, track: trading, method_a: mcafee, method_b: trade_reduction, metric: gain_from_trade_ratio, direction: two_sided, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: trading_efficiency}
  - {contrast_id: T-SBBA-vs-TR, track: trading, method_a: sbba, method_b: trade_reduction, metric: gain_from_trade_ratio, direction: two_sided, estimand: mean_oriented_difference, inference_unit: independent_block, ci_method: percentile_block_bootstrap, multiplicity_family: trading_efficiency}

representativeness:
  continuous_metrics: [wasserstein_distance]
  profile_metrics: [jensen_shannon_divergence]
  support_metrics: [heldout_outside_development_fraction, source_coverage]
  composite_score: forbidden

