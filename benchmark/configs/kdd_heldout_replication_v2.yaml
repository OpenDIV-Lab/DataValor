schema_version: "1.0"
manifest_kind: confirmatory_protocol_config
protocol_revision: "1"
cohort: heldout
replication_wave: v2
replication_release_id: kdd2027-heldout-replication-v2
evidence_scope: real_trained_game
minimum_blocks_per_track: 2
random_seeds: [1701, 2903, 4703]
stopping_rule: run_every_frozen_case_method_seed_once_and_retain_all_outcomes
source_selection_rule: two_licensed_sources_or_prespecified_unused_2024_fridays_per_track_selected_before_mechanism_outcomes

# This is deliberately identical to the v1 result surface. Replication may
# compare the six frozen estimands but cannot add an outcome-selected metric.
result_contract:
  diagnostic_keys: []
  metric_ids:
    valuation:
      - addition_auc
      - bad_owner_rank
      - characteristic_replication_inflation_ratio
      - corruption_auprc
      - corruption_auroc
      - corruption_topk_f1
      - dummy_violation
      - efficiency_residual
      - kendall_stability
      - least_core_max_violation
      - removal_auc
      - replication_gain
      - replication_owner_rank_change
      - replication_reward_share_gain
      - replication_score_inflation_ratio
      - runtime_seconds
      - score_mae
      - score_spearman
      - split_payoff_change
      - symmetry_gap
      - topk_test_utility
      - utility_calls
      - utility_recovery
    procurement:
      - allocation_monotonicity_violation
      - budget_used_ratio
      - budget_violation
      - buyer_utility
      - critical_payment_gap
      - duplicate_spend_ratio
      - largest_singleton_share
      - max_deviation_gain
      - noisy_spend_ratio
      - oracle_ratio
      - oracle_utility
      - procurement_efficiency_loss
      - profitable_deviation_count
      - realized_utility
      - seller_ir_violation_count
      - seller_surplus
      - total_payment
    trading:
      - allocation_efficiency
      - auctioneer_surplus
      - buyer_surplus
      - efficient_trade_count
      - false_trade_count
      - gain_from_trade_ratio
      - individual_rationality
      - max_deviation_gain
      - normalized_trade_loss
      - oracle_gain_from_trade
      - participant_surplus_ratio
      - price_dispersion
      - profitable_deviation_count
      - quantity_weighted_trade_volume
      - realized_gain_from_trade
      - seller_revenue
      - seller_surplus_trading
      - strong_budget_balance
      - trade_count
      - trade_count_loss
      - trading_max_deviation_gain
      - weak_budget_balance

