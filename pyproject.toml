[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datavalor"
version = "0.1.0a0"
description = "A Toolkit for Data Valorization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Data Intelligence and Valorization Laboratory (DIV Lab)"}]
keywords = ["data-valuation", "data-pricing", "data-market", "data-quality"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
quality = ["cleanlab>=2.0", "great-expectations>=0.18", "evidently>=0.4"]
profiling = ["ydata-profiling>=4.0"]
valuation = ["pydvl>=0.9", "opendataval>=1.0"]
benchmark = ["wilds>=2.0"]
governance = ["acryl-datahub>=0.13", "openmetadata-ingestion>=1.5", "pydeequ>=1.2"]
torch = ["torchmetrics>=1.0"]
simulation = ["mesa>=2.0"]
market = ["ocean-lib>=0.1"]

[project.urls]
Homepage = "https://github.com/DIV-Lab/DataValor"
Repository = "https://github.com/DIV-Lab/DataValor"

[project.scripts]
datavalor = "datavalor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702"]
