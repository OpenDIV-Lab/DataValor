schema_version: datavalor.implementation_migration_manifest/v1
status: template
source_path: /root/yusen/data_value_market_kit
target_package: datavalor
version_policy: use_current_complete_files
note: >-
  这是完整实现文件迁移记录模板。每一批迁移填写 source_paths、target_paths、
  target_interfaces、changes、tests_migrated 和 status；迁入后源命名空间必须被替换。
batches:
  - batch_id: stage_00_inventory_v1
    source_paths:
      - src/dvmk/core/
      - src/dvmk/data_product/
      - src/dvmk/distribution/
      - configs/
      - examples/
      - plugins/
      - tests/
    target_paths:
      - src/datavalor/core/
      - src/datavalor/data_gov/
      - src/datavalor/toolkit/benchmark/
      - configs/
      - examples/
      - plugins/
      - tests/
    target_interfaces:
      - datavalor.core.ArtifactStore
      - datavalor.core.RunContext
      - datavalor.core.Registry
    changes:
      - inventoried the complete Stage 0 and Stage 1 source file set
      - mapped source implementations to DataValor module boundaries
      - removed source namespace and source-specific protocol assumptions
    tests_migrated:
      - tests/test_stage01_data_products.py
    status: completed
  - batch_id: stage_01_foundation_and_data_products_v1
    source_paths:
      - src/dvmk/core/artifacts.py
      - src/dvmk/core/io.py
      - src/dvmk/core/run_metadata.py
      - src/dvmk/data_product/
      - src/dvmk/distribution/
    target_paths:
      - src/datavalor/core/io.py
      - src/datavalor/core/artifact_store.py
      - src/datavalor/core/run_metadata.py
      - src/datavalor/data_gov/data_product/
      - src/datavalor/toolkit/benchmark/data_sources/
      - src/datavalor/toolkit/benchmark/data_perturbations/
    target_interfaces:
      - datavalor.core.ArtifactStore
      - datavalor.data_gov.MetadataExtractor
      - datavalor.toolkit.benchmark.BenchmarkDataProvider
      - datavalor.toolkit.benchmark.DataPerturbation
    changes:
      - ported file hashing, canonical record hashing, JSON and JSONL I/O
      - added a DataValor LocalArtifactStore implementation
      - ported JSON, JSONL, CSV, Parquet, directory and iterable adapters
      - ported local, parametric, scikit-learn and Hugging Face data providers
      - ported sampling, missingness, label shift and split operators with audit metadata
      - replaced source namespace, output paths and source-specific error messages
    tests_migrated:
      - tests/test_stage01_data_products.py
    status: completed
  - batch_id: stage_02_profile_and_evaluation_v1
    source_paths:
      - src/dvmk/evaluation/
    target_paths:
      - src/datavalor/data_eval/operators.py
      - src/datavalor/data_eval/task_utility.py
    target_interfaces:
      - datavalor.data_eval.QualityMetric
      - datavalor.data_eval.TaskUtilityEvaluator
      - datavalor.data_prof.ProfileMetric
    changes:
      - ported lexical diversity as a typed QualityMetric
      - added field summary statistics with descriptive score direction
      - added callable and record-count task utility evaluators
      - replaced source metric result and registry semantics with DataValor models
    tests_migrated:
      - tests/test_stage23_evaluation_valuation.py
    status: completed
  - batch_id: stage_03_valuation_and_contribution_v1
    source_paths:
      - src/dvmk/valuation/
    target_paths:
      - src/datavalor/data_value/contribution.py
      - src/datavalor/data_value/requirements.py
      - src/datavalor/data_value/valuators.py
      - src/datavalor/data_value/utilities.py
      - src/datavalor/data_value/value_functions.py
      - src/datavalor/data_value/task_metrics.py
      - src/datavalor/data_value/contribution_advanced.py
      - src/datavalor/data_value/advanced_valuation.py
      - configs/workflows/stage3_advanced_valuation.json
      - examples/08_stage3_advanced_valuation.py
    target_interfaces:
      - datavalor.data_value.ContributionValuator
      - datavalor.data_value.DataValuator
      - datavalor.data_value.ValuationRequest
    changes:
      - ported leave-one-out, exact Shapley and Monte Carlo Shapley calculations
      - ported requirement loading and bundle merging
      - ported transparent weighted user-task valuation
      - added safe AST-based symbolic valuation and ridge linear trainable valuation
      - added classification, regression, ranking and incremental-gain task metrics
      - added group Shapley, pairwise interaction, bootstrap stability and quality/scenario valuation
      - added Banzhaf contribution and proportional monetary allocation with negative policy
      - added a complete artifact workflow and stage-3 regression tests
      - separated contribution reports and value estimates from prices and payments
    tests_migrated:
      - tests/test_stage23_evaluation_valuation.py
      - tests/test_stage3_advanced_valuation.py
    status: completed
  - batch_id: stage_04_pricing_mechanisms_v1
    source_paths: [src/dvmk/pricing/]
    target_paths:
      - src/datavalor/data_price/mechanisms.py
      - src/datavalor/data_price/pricing_models.py
      - src/datavalor/data_price/constraints.py
      - src/datavalor/data_price/properties.py
      - src/datavalor/data_price/mechanisms_advanced.py
      - configs/workflows/stage4_pricing.json
      - examples/09_stage4_pricing_and_mechanisms.py
    target_interfaces:
      - datavalor.data_price.PricingMechanism
      - datavalor.data_price.PriceConstraint
      - datavalor.data_price.OnlinePricingModel
    changes:
      - ported auction, posted-price, VCG, procurement and projection implementations
      - normalized monetary arithmetic to Decimal-backed Money
      - added cost-plus, value-based, usage-based and quality/freshness quote models
      - added adaptive demand online pricing with acceptance feedback
      - added price-band and volume-discount constraints with provenance diagnostics
      - added multi-unit uniform-price auction with partial quantity and welfare
      - added budget-aware and quality-aware procurement with numerical dust guard
      - added executable individual-rationality, budget and capacity checks
      - added stage-4 end-to-end example and declarative workflow configuration
    tests_migrated:
      - tests/test_stage45_pricing_market_analysis.py
      - tests/test_stage4_pricing_models.py
      - tests/test_stage4_mechanisms_properties.py
    status: completed
  - batch_id: stage_05_market_benchmark_analysis_v1
    source_paths:
      - src/dvmk/simulation/
      - src/dvmk/benchmark/
      - src/dvmk/analysis/
    target_paths:
      - src/datavalor/data_market/simulation/
      - src/datavalor/toolkit/benchmark/market.py
      - src/datavalor/toolkit/analysis/
      - src/datavalor/data_market/operations.py
      - configs/workflows/stage5_market_benchmark.json
      - examples/10_stage5_market_benchmark_analysis.py
    target_interfaces:
      - datavalor.data_market.simulation.ParticipantStrategy
      - datavalor.data_market.simulation.MarketSimulator
      - datavalor.toolkit.benchmark.BenchmarkMetric
      - datavalor.toolkit.benchmark.BenchmarkRunner
      - datavalor.toolkit.analysis.Analyzer
      - datavalor.toolkit.analysis.FrontierAnalyzer
    changes:
      - ported participant strategy families and finite multi-round simulation
      - ported welfare/revenue benchmark measurements and repetition matrix runner
      - ported bootstrap, paired comparison and Pareto frontier helpers
      - implemented participant-specific state transitions and explicit non-equilibrium diagnostics
      - added adaptive, bandit, multiplicative-weights, UCB and contextual strategy updates
      - added in-memory listing/participant operations and contribution revenue reconciliation
      - added stable matrix seeds, simulation metrics, failure witnesses and directional Pareto analysis
      - added executable stage-5 benchmark example and workflow configuration
    tests_migrated:
      - tests/test_stage45_pricing_market_analysis.py
      - tests/test_stage5_market_benchmark_analysis.py
    status: completed
  - batch_id: stage_06_native_integration_v1
    source_paths:
      - src/dvmk/cli.py
      - configs/
      - examples/
      - plugins/
      - tests/
    target_paths:
      - src/datavalor/cli/
      - configs/cli/
      - examples/
      - plugins/
      - tests/test_stage6_cli.py
    target_interfaces:
      - datavalor.core.PipelineRunner
      - datavalor.core.Registry
      - datavalor.toolkit.benchmark.BenchmarkSpec
    changes:
      - rebuilt the command line entry point as datavalor CLI
      - added JSON/YAML configuration loading and local plugin loading
      - added profile and evaluate commands using DataValor public interfaces
      - migrated runnable configuration and example documentation
      - added CLI smoke tests and removed source command naming
    tests_migrated:
      - tests/test_stage6_cli.py
    status: completed
  - batch_id: stage_07_modal_evaluation_v1
    source_paths:
      - src/dvmk/evaluation/text/
      - src/dvmk/evaluation/image/
      - src/dvmk/evaluation/audio/
      - src/dvmk/evaluation/video/
      - src/dvmk/evaluation/multimodal/
    target_paths:
      - src/datavalor/data_eval/_modal_utils.py
      - src/datavalor/data_eval/tabular.py
      - src/datavalor/data_eval/text.py
      - src/datavalor/data_eval/image.py
      - src/datavalor/data_eval/audio.py
      - src/datavalor/data_eval/video.py
      - src/datavalor/data_eval/multimodal.py
      - configs/workflows/stage7_multimodal_evaluation.json
      - examples/11_stage7_multimodal_evaluation.py
    target_interfaces:
      - datavalor.data_eval.QualityMetric
      - datavalor.data_eval.MetricResult
    changes:
      - split evaluation metrics into independent modality files
      - added tabular schema, distribution, outlier and label-balance metrics
      - added text lexical, length and repetition metrics
      - added image metadata, aspect-ratio and pixel-validity metrics
      - added audio metadata, clipping and silence metrics
      - added video format, motion, scene, temporal and privacy metrics
      - added multimodal package integrity, checksum and timestamp alignment
      - preserved metric direction, scope, evidence and diagnostics
      - added offline modality evaluation example and workflow configuration
    tests_migrated:
      - tests/test_stage7_modal_evaluation.py
    status: completed
