schema_version: "0.1"
status: design_only
data_class: synthetic_or_shadow_until_validated
scene_source: ../../HGProjectSeries/central_control_prototype/research_topics/00_base_model_scene.md
principles:
  - normal_path_lights_out
  - exception_path_authorized_human_takeover
  - agv_expected_order_is_not_arrival_order
  - workstation_queries_point_then_resolves_carrier
  - no_silent_event_overwrite

common_fields:
  - event_id
  - event_type
  - event_time
  - ingest_time
  - source
  - point_code
  - point_note
  - carrier_code
  - work_order_no
  - order_no
  - material_code
  - material_name
  - loaded_qty
  - planned_qty
  - current_process
  - next_station
  - process_status
  - recipe_version
  - serial_range
  - freeze_reason
  - operator_id

queue_semantics:
  expected_queue: "AGV task creation/dispatch order; planning fact only"
  arrived_queue: "order confirmed by workstation point polling and carrier resolution"
  arrival_evidence: "point_code + point_note + carrier_code + source_timestamp"

topics:
  - id: carrier_handover
    station_scope:
      - 5-CF03-G001（5号立库出库位）
      - F11-IN-01（脱脂上料位）
      - F8-LN-A-02（喷漆线A上料位）
      - P1-MK-01（刻字读码位）
    current_gap: "立库、AGV、工位和缓存之间重复扫码，位置和工单上下文易丢失"
    minimum_inputs:
      - agv_created
      - agv_picked
      - point_polled
      - carrier_resolved
    automatic_actions:
      - update_carrier_location_projection
      - append_arrived_queue_after_resolution
      - create_agv_dispatch_draft
    hard_constraints:
      - one_carrier_one_active_location
      - one_carrier_one_unfinished_work_order
      - frozen_carrier_cannot_be_dispatched
    methods:
      - finite_capacity_discrete_event_simulation
      - event_sourced_state_projection
    phase: A
    metrics:
      - location_unknown_duration
      - duplicate_binding_rate
      - repeated_scan_minutes
      - agv_wait_time
    rollback: "人工确认位置，沿用原 MES/AGV 任务，不删除中控事实事件"

  - id: f11_type_sensitive_batch
    station: F11-IN-01（脱脂上料位）
    sensitivity: type_sensitive_quantity_insensitive
    current_gap: "脱脂读码存在识别失败，工位仍需重复确认型号"
    minimum_inputs:
      - point_polled
      - carrier_resolved
      - material_code
      - material_name
      - recipe_version
      - process_status
    automatic_actions:
      - show_current_and_next_material_type
      - preload_recipe_version
      - submit_claim_when_quality_gate_passes
    hard_constraints:
      - carrier_material_unique
      - recipe_material_compatible
      - source_data_age_within_f11_threshold
      - frozen_work_order_cannot_start
    methods:
      - sequence_dependent_setup_scheduling
      - constrained_risk_aware_dispatch
    phase: A
    metrics:
      - repeated_scan_count
      - preparation_time
      - type_mismatch_interception_rate
      - sensor_free_normal_start_rate
    rollback: "读码器/人工核验只作异常补偿，不覆盖载具反查事实"

  - id: f8_tray_genealogy
    station: F8-LN-A-02（喷漆线A上料位）
    sensitivity: type_and_quantity_sensitive_piece_id_insensitive
    current_gap: "筐拆盘、机械臂上下料、合筐和 NG 隔离缺少统一关系"
    minimum_inputs:
      - carrier_resolved
      - tray_slot_occupied
      - plc_load_complete
      - plc_unload_complete
      - ng_isolated
    automatic_actions:
      - allocate_tray_set
      - publish_robot_load_sequence
      - create_child_tray_relations
      - create_merged_carrier_relation
    hard_constraints:
      - parent_qty_equals_child_qty_plus_ng_plus_loss
      - tray_slot_not_double_bound
      - recipe_material_compatible
      - ng_piece_cannot_reenter_normal_queue
    methods:
      - multi_granularity_flow_conservation
      - robot_tray_assignment
      - discrete_event_simulation
    phase: B
    metrics:
      - quantity_conservation_error
      - tray_binding_completeness
      - robot_wait_time
      - manual_rework_ratio
    rollback: "人工盘点和人工合筐；保留已生成的 split/merge/NG 事件"

  - id: p1_serial_control
    station: P1-MK-01（刻字读码位）
    sensitivity: type_quantity_and_piece_id_sensitive
    current_gap: "设备本地递增、离线同步和返工可能造成重号或跳号"
    minimum_inputs:
      - batch_release
      - serial_range_allocated
      - engraving_started
      - engraving_completed
      - rework
      - ng_isolated
    automatic_actions:
      - allocate_non_overlapping_serial_range
      - validate_serial_consumption
      - issue_rework_serial_task
    hard_constraints:
      - serial_ranges_do_not_intersect
      - used_serial_is_subset_of_allocated_serial
      - completed_serial_is_subset_of_started_serial
      - offline_window_must_be_finite_and_unexpired
    methods:
      - versioned_interval_allocation
      - idempotent_event_processing
      - offline_window_consistency_check
    phase: C
    metrics:
      - duplicate_serial_rate
      - missing_serial_rate
      - serial_ack_latency
      - offline_window_violation_count
    rollback: "停止自动下发，转人工重刻审批；不得允许设备继续本地递增"

  - id: vulcanization_preparation
    station_scope:
      - vulcanization_machines
      - mold_buffer
      - rubber_material_buffer
    current_gap: "人员持续巡视多台机，模具、胶料和后处理接收窗口未联合调度"
    minimum_inputs:
      - machine_cycle_started
      - machine_cycle_completed
      - machine_stop_reason
      - mold_location
      - material_location
      - downstream_acceptance_window
    automatic_actions:
      - predict_next_cycle_material_need
      - create_mold_preparation_task
      - create_agv_delivery_draft
    hard_constraints:
      - machine_material_compatibility
      - mold_capability_match
      - maintenance_window_respected
      - quality_hold_blocks_release
    methods:
      - rolling_cp_sat_or_milp
      - discrete_event_simulation
      - production_maintenance_joint_scheduling
    phase: D
    metrics:
      - machine_starvation_rate
      - machine_blocking_rate
      - mold_search_time
      - on_time_start_rate
    rollback: "仅生成准备建议，由班组确认后沿用原领料和换模流程"

  - id: postprocess_packaging
    station_scope:
      - reduction
      - grinding
      - inspection
      - engraving
      - oiling_packaging
      - finished_goods_storage
    current_gap: "后处理找件、返修回溯、包装载具绑定和成品入库未形成连续状态链"
    minimum_inputs:
      - point_polled
      - process_completed
      - inspection_result
      - rework
      - packaging_carrier_bound
      - finished_goods_location
    automatic_actions:
      - append_downstream_queue
      - route_hold_or_rework
      - create_packaging_and_putaway_task
    hard_constraints:
      - quality_hold_blocks_downstream_release
      - packaging_qty_matches_released_qty
      - external_transfer_requires_two_way_confirmation
    methods:
      - multi_stage_queue_control
      - quality_gate_routing
      - agv_handover_synchronization
    phase: D
    metrics:
      - finding_part_time
      - interprocess_wait_time
      - rework_traceability_rate
      - packaging_binding_error_rate
    rollback: "外协和包装采用双向人工确认，不自动关闭原任务"

  - id: human_task_reconfiguration
    station_scope:
      - front_processing
      - vulcanization
      - post_processing
    current_gap: "人工 heavy 任务未区分直接作业、物流、换型、质量、异常和管理"
    minimum_inputs:
      - task_start_end
      - operator_id
      - skill_qualification
      - shift
      - absence
      - exception_event
    automatic_actions:
      - recommend_task_mode_H_R_C
      - assign_qualified_exception_responder
      - calculate_skill_coverage_gap
    hard_constraints:
      - qualification_valid
      - shift_and_rest_limits_respected
      - safety_tasks_not_removed
      - maintenance_and_supervision_coverage_preserved
    methods:
      - dual_resource_cp_sat_or_milp
      - discrete_event_simulation
      - multiobjective_pareto_analysis
    phase: B
    metrics:
      - normal_path_direct_labor_minutes
      - exception_response_time
      - skill_coverage_gap
      - overtime
    rollback: "岗位重组先在影子模式运行，班组保留原排班和人工接管权"

  - id: rolling_prediction_recovery
    station_scope:
      - all_connected_workstations
      - agv_fleet
      - buffers
    current_gap: "设备、AGV、质量和人工覆盖事件不能触发统一重算"
    minimum_inputs:
      - point_polled
      - carrier_resolved
      - started
      - completed
      - machine_stop
      - quality_hold
      - external_return
      - buffer_timeout
    automatic_actions:
      - predict_arrival_and_acceptance_interval
      - replan_queue_and_agv_draft
      - issue_exception_recovery_recommendation
    hard_constraints:
      - quality_hold_blocks_release
      - active_claim_cannot_be_lost
      - prediction_must_include_data_age_and_confidence
      - unsafe_action_requires_human_approval
    methods:
      - quantile_or_survival_prediction
      - rolling_cp_sat_milp_or_alns
      - discrete_event_simulation
    phase: D
    metrics:
      - agv_empty_run_time
      - workstation_starvation_rate
      - prediction_interval_coverage
      - recovery_time
      - manual_override_rate
    rollback: "停止自动重排，仅显示预测和告警；AGV/工位沿用上一版批准任务"
